# A group carries one `expect` and the queries it applies to, so the
# expectation is written once per idea rather than once per line and the name
# says what the idea was.
#
#   expect: completed    feeding the query one character at a time must reach
#                        EOF with the statement completed
#   expect: stuck        the feed must get stuck first - some character is one
#                        the graph never offered
#
# Whitespace is load bearing here, so a query that has any at either end, or
# that mixes tabs into it, is written double quoted with the escapes visible.
# A query that runs over several lines is a `|-` block, which keeps every
# newline but the last.

- group: the root README's own examples
  expect: completed
  queries:
    - SELECT email, first_name FROM users;
    - SELECT u.email, u.first_name FROM users AS u;
    - SELECT email, body FROM users, comments;
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.user_id;
    - SELECT email, title FROM users FULL JOIN posts ON users.id = posts.user_id;
    - SELECT title, c.body FROM posts LEFT JOIN comments AS c ON posts.id = c.post_id;
    - |-
      SELECT email, title, c.body
      FROM users
      INNER JOIN posts ON users.id = posts.user_id
      INNER JOIN comments AS c ON posts.id = c.post_id;
    - SELECT email FROM users WHERE created_at IS NOT NULL;
    - SELECT email FROM users WHERE first_name LIKE 'A%';
    - |-
      SELECT email, title
      FROM users
      INNER JOIN posts ON users.id = posts.user_id
      WHERE created_at < published_at;
    - SELECT email FROM users WHERE email = 'a' AND users.id > 1;
    - SELECT email FROM users WHERE NOT email LIKE 'a%';
    - SELECT email FROM users WHERE (email = 'a' OR email = 'b') AND NOT users.id = 1;

- group: the projection
  expect: completed
  queries:
    - SELECT email FROM users;
    - SELECT first_name, last_name, email FROM users;
    - SELECT title, body FROM posts;
    - SELECT verified FROM users;
    - SELECT published_at FROM posts;
    # The same field twice says nothing new, and the algebra says so with no
    # special case: its constraint is idempotent.
    - SELECT email, email FROM users;
    # The comma carries its own whitespace on both sides, so all four of these
    # spellings are the one separator.
    - SELECT email,first_name FROM users;
    - SELECT email ,first_name FROM users;
    - SELECT email , first_name FROM users;
    - |-
      SELECT email,
      first_name FROM users;
    - "SELECT email\t,\tfirst_name FROM users;"

- group: whitespace, where it is free
  expect: completed
  queries:
    - SELECT  email  FROM  users;
    - "SELECT                 email FROM users;"
    - "SELECT\temail\tFROM\tusers;"
    - |-
      SELECT
      email
      FROM
      users;
    - "SELECT \t\n email \n\t FROM \t\n users;"

- group: aliases
  expect: completed
  queries:
    - SELECT u.email FROM users AS u;
    - SELECT u2.email FROM users AS u2;
    - SELECT _u.email FROM users AS _u;
    # `users` is a table name and so excluded, but the group only ever removes
    # the right to stop - one more character and the identifier is free.
    - SELECT users2.email FROM users AS users2;
    - SELECT x.email, x.verified FROM users AS x;
    - SELECT p.title, p.body FROM posts AS p;
    - SELECT u.email, title FROM users AS u, posts;

- group: the FROM clause
  expect: completed
  queries:
    - SELECT email, title FROM users ,posts;
    - |-
      SELECT email, title FROM users
      ,
      posts;
    - SELECT email, title FROM users LEFT JOIN posts ON users.id = posts.user_id;
    - SELECT email, title FROM users RIGHT JOIN posts ON users.id = posts.user_id;
    - SELECT email, body FROM users INNER JOIN comments ON users.id = comments.user_id;
    - SELECT u.email, title FROM users AS u INNER JOIN posts ON u.id = posts.user_id;
    # A join is offered for being a foreign key neighbour, not for being
    # required: nothing here needs `comments` and the clause is still legal.
    - SELECT email FROM users INNER JOIN comments ON users.id = comments.user_id;

- group: the WHERE clause
  expect: completed
  queries:
    # Numeric, against the literal pattern its class names.
    - SELECT email FROM users WHERE users.id = 1;
    - SELECT email FROM users WHERE users.id != -1;
    - SELECT email FROM users WHERE users.id >= -1;
    - SELECT email FROM users WHERE users.id <= 100;
    - SELECT email FROM users WHERE users.id > 3.5;
    # Text, which is the only class that may be matched against a pattern.
    - SELECT email FROM users WHERE email LIKE '%keyword%';
    - SELECT email FROM users WHERE email NOT LIKE '%a%';
    - SELECT email FROM users WHERE email = '';
    # Boolean and temporal.
    - SELECT email FROM users WHERE verified = TRUE;
    - SELECT email FROM users WHERE verified != FALSE;
    - SELECT email FROM users WHERE created_at > '2024-01-31';
    - SELECT email FROM users WHERE created_at = '2024-01-31 12:30:00';
    # Only a column that can actually be null may be tested for it.
    - SELECT email FROM users WHERE created_at IS NULL;
    - SELECT title FROM posts WHERE published_at IS NOT NULL;
    # A column may stand opposite another of its own class.
    - SELECT title FROM posts WHERE title = body;
    - SELECT email FROM users WHERE first_name = last_name;
    # Connectives, negation and brackets.
    - SELECT email FROM users WHERE verified = TRUE AND created_at IS NULL;
    - SELECT email FROM users WHERE verified = TRUE OR verified = FALSE;
    - SELECT email FROM users WHERE NOT verified = TRUE;
    - SELECT email FROM users WHERE NOT (email = 'a');
    - SELECT email FROM users WHERE ( email = 'a' );
    - |-
      SELECT email FROM users WHERE (
      email = 'a'
      );
    - SELECT email FROM users WHERE (email = 'a' AND (users.id = 1 OR users.id = 2));
    # Three brackets deep is the limit, and three is reachable.
    - SELECT email FROM users WHERE ((email = 'a'));
    - SELECT email FROM users WHERE (((email = 'a')));
    # A filter may name a column the projection never asked for, and both
    # sides of a join are in the one virtual table.
    - SELECT u.email FROM users AS u WHERE u.verified = TRUE;
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.user_id WHERE title LIKE 'a%';
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.user_id WHERE users.id = posts.user_id;

- group: stepping away from a clause and still closing it
  expect: completed
  queries:
    # The `;` carries the whitespace in front of it, so a head that has taken
    # a space can still come back and close. Without that the only things left
    # after the space would be WHERE and the four join types.
    - SELECT email FROM users ;
    - "SELECT email FROM users\t;"
    - SELECT email FROM users     ;
    - |-
      SELECT email FROM users
      ;
    - "SELECT email FROM users \n\t ;"
    # Every clause the terminator can follow, stepped away from first.
    - SELECT email, body FROM users, comments ;
    - SELECT u.email FROM users AS u ;
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.user_id ;
    - SELECT email FROM users WHERE verified = TRUE ;
    - SELECT email FROM users WHERE created_at IS NULL ;
    - SELECT email FROM users WHERE (email = 'a') ;

- group: an alias on a join target
  expect: completed
  queries:
    # A join target carries its `AS` the way a FROM entry does, and answers to
    # the alias in its own ON clause.
    - SELECT email, p.title FROM users INNER JOIN posts AS p ON users.id = p.user_id;
    - SELECT email, p.title FROM users LEFT JOIN posts AS p ON users.id = p.user_id;
    - SELECT email, p.title FROM users RIGHT JOIN posts AS p ON users.id = p.user_id;
    - SELECT email, p.title FROM users FULL JOIN posts AS p ON users.id = p.user_id;
    - SELECT email, c.body FROM users INNER JOIN comments AS c ON users.id = c.user_id;
    - SELECT email, posts2.title FROM users INNER JOIN posts AS posts2 ON users.id = posts2.user_id;
    # Both sides renamed, and a chain of them.
    - SELECT u.email, p.title FROM users AS u INNER JOIN posts AS p ON u.id = p.user_id;
    - SELECT u.email, p.title, c.body FROM users AS u INNER JOIN posts AS p ON u.id = p.user_id INNER JOIN comments AS c ON p.id = c.post_id;

- group: whitespace, where it is not free
  expect: stuck
  queries:
    # A keyword needs whitespace on the side it meets a name on.
    - SELECTemail FROM users;
    - SELECT emailFROM users;
    - SELECT email FROM users WHEREverified = TRUE;
    - SELECT email FROM usersWHERE verified = TRUE;
    # A condition has whitespace on both sides of its operator, always.
    - SELECT email FROM users WHERE users.id>1;
    - SELECT email FROM users WHERE users.id >1;
    - SELECT email FROM users WHERE users.id> 1;
    - SELECT email,title FROM users INNER JOIN posts ON users.id=posts.user_id;
    # The qualifying dot has none on either side.
    - SELECT email FROM users WHERE users . id = 1;
    - SELECT u . email FROM users AS u;
    # Nothing precedes SELECT and nothing follows the semicolon.
    - " SELECT email FROM users;"
    - "SELECT email FROM users;\n"

- group: aliases that are not in scope
  expect: stuck
  queries:
    # An alias is introduced in the projection and nowhere else, so neither
    # half of this pair can stand on its own.
    - SELECT u.email FROM users;
    - SELECT email FROM users AS u;
    # A renamed source answers to its alias afterwards and to nothing else.
    - SELECT u.email FROM users AS u WHERE users.verified = TRUE;
    - SELECT u.email, title FROM users AS u INNER JOIN posts ON users.id = posts.user_id;
    # A table name qualifies nothing until the FROM clause has placed it, and
    # an alias may not be a name that already spells something.
    - SELECT users.email FROM users;
    - SELECT users.email FROM users AS users;
    - SELECT SELECT.email FROM users AS SELECT;

- group: a join target that owes its alias
  expect: stuck
  queries:
    # The projection asked for `p.title`, so the alias has to be declared, and
    # the only place a join can declare it is on its own target. Joining the
    # bare table leaves the scope undischarged and the statement cannot close.
    - SELECT email, p.title FROM users INNER JOIN posts ON users.id = posts.user_id;
    - SELECT title, c.body FROM posts LEFT JOIN comments ON posts.id = comments.post_id;
    # Declared, then not used: a renamed source answers to its alias and to
    # nothing else, the ON clause included.
    - SELECT email, p.title FROM users INNER JOIN posts AS p ON users.id = posts.user_id;
    - SELECT u.email, p.title FROM users AS u INNER JOIN posts AS p ON u.id = posts.user_id;
    # An alias the projection never opened is not the one that is owed.
    - SELECT email, p.title FROM users INNER JOIN posts AS q ON users.id = q.user_id;

- group: joins the schema cannot answer
  expect: stuck
  queries:
    # The ON columns are read off the foreign key, not chosen.
    - SELECT email, title FROM users INNER JOIN posts ON posts.user_id = users.id;
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.id;
    - SELECT email, body FROM users INNER JOIN comments ON users.id = comments.post_id;
    # Four join types, and these are not among them.
    - SELECT email, title FROM users JOIN posts ON users.id = posts.user_id;
    - SELECT email, title FROM users CROSS JOIN posts ON users.id = posts.user_id;
    # A join clause is not a join clause without its ON.
    - SELECT email, title FROM users INNER JOIN posts users.id = posts.user_id;
    - SELECT email FROM users INNER JOIN posts;

- group: names the selection has ruled out
  expect: stuck
  queries:
    # `body` lives on posts and comments, so it says exactly one of them is
    # where it came from - naming both contradicts it.
    - SELECT email, body FROM users, posts, comments;
    - SELECT title, body FROM posts INNER JOIN comments ON posts.id = comments.post_id;
    - SELECT email, body FROM users INNER JOIN comments ON users.id = comments.user_id FULL JOIN posts ON comments.post_id = posts.id;
    # Inside a clause the rule is SQL's own: two nodes supply `id`, so the
    # bare name is refused rather than resolved.
    - SELECT email, title FROM users INNER JOIN posts ON users.id = posts.user_id WHERE id = 1;

- group: types that do not meet
  expect: stuck
  queries:
    # Ordering belongs to the classes that have an order, matching to text
    # alone, equality to all of them.
    - SELECT email FROM users WHERE email < 5;
    - SELECT email FROM users WHERE users.id LIKE 'a%';
    - SELECT email FROM users WHERE verified > TRUE;
    # Only a column that may be null may be tested for it, and a primary key
    # never may, however it was declared.
    - SELECT email FROM users WHERE users.id IS NULL;
    - SELECT email FROM users WHERE email IS NULL;
    # The other side has to be of the column's own class.
    - SELECT email FROM users WHERE email = users.id;
    - SELECT email FROM users WHERE users.id = '1';
    # A literal has to spell the pattern its class names.
    - SELECT email FROM users WHERE created_at > '2024';
    - SELECT email FROM users WHERE verified = true;
    # Comparing a column with itself says nothing, however it is spelled.
    - SELECT email FROM users WHERE email = email;
    - SELECT email FROM users WHERE email = users.email;

- group: the WHERE clause, past what it offers
  expect: stuck
  queries:
    # Three brackets deep is the limit; the fourth is never opened.
    - SELECT email FROM users WHERE ((((email = 'a'))));
    - SELECT email FROM users WHERE (email = 'a';
    - SELECT email FROM users WHERE email = 'a');
    # One NOT in front of a predicate, one connective between two.
    - SELECT email FROM users WHERE NOT NOT verified = TRUE;
    - SELECT email FROM users WHERE verified = TRUE AND OR verified = FALSE;

- group: names the schema does not have
  expect: stuck
  queries:
    - SELECT nickname FROM users;
    - SELECT email FROM accounts;
    - SELECT email FROM users WHERE nickname = 'a';

- group: outside the subset
  expect: stuck
  queries:
    # Every keyword is upper case.
    - select email from users;
    - Select Email From Users;
    # The projection is columns, bare or qualified - nothing else.
    - SELECT * FROM users;
    - SELECT DISTINCT email FROM users;
    - SELECT email AS e FROM users;
    - SELECT COUNT(id) FROM users;
    - SELECT 1 FROM users;
    # No clause follows the WHERE clause.
    - SELECT email FROM users GROUP BY email;
    - SELECT email FROM users ORDER BY email;
    - SELECT email FROM users LIMIT 10;
    # A condition is one operator between two operands.
    - SELECT email FROM users WHERE users.id IN (1, 2);
    - SELECT email FROM users WHERE users.id BETWEEN 1 AND 2;
    - SELECT email FROM users WHERE users.id = (SELECT id FROM posts);
    # One statement, and it is a SELECT.
    - SELECT email FROM users UNION SELECT email FROM users;
    - INSERT INTO users VALUES (1);
    - UPDATE users SET email = 'a';
    - DELETE FROM users;

- group: statements that never terminate
  expect: stuck
  queries:
    # EOF with the statement unfinished is stuck too: the graph is still
    # waiting, so what was fed was not a statement.
    - SELECT email FROM users
    - SELECT FROM users;
    - SELECT email users;
    - SELECT email FROM;
    - SELECT email FROM users WHERE;
    - SELECT email FROM users WHERE verified = TRUE AND;
    # The terminator ends it, and nothing may follow.
    - SELECT email FROM users;;
    - SELECT email FROM users; SELECT email FROM users;

- group: whitespace stretched as far as it goes
  expect: completed
  queries:
    # Runs of whitespace far past anything a writer would type, in
    # every position the grammar leaves free.
    - "SELECT                email                FROM                users                ;"
    - "SELECT\t\t\t\temail\t\t\t\tFROM\t\t\t\tusers\t\t\t\t;"
    - "SELECT\n\n\n\nemail\n\n\n\nFROM\n\n\n\nusers\n\n\n\n;"
    - "SELECT \t\n \t\n email \t\n \t\n FROM \t\n \t\n users \t\n \t\n ;"
    - "SELECT email\n\t \n\t,\n\t \n\tfirst_name FROM users;"
    - "SELECT email                ,                first_name FROM users;"
    - "SELECT email, body FROM users                ,                comments;"
    - "SELECT email, title FROM users\n\n\nINNER JOIN\n\n\nposts\n\n\nON\n\n\nusers.id\n\n\n=\n\n\nposts.user_id;"
    - "SELECT u.email FROM users\t\tAS\t\tu;"
    - "SELECT email FROM users\n\nWHERE\n\nverified\n\n=\n\nTRUE;"
    - "SELECT email FROM users WHERE verified = TRUE\n\n\tAND\n\n\tcreated_at IS NULL;"
    - "SELECT email FROM users WHERE email                LIKE                'a%';"

- group: whitespace inside the brackets
  expect: completed
  queries:
    # `(` carries the whitespace after it and `)` the whitespace before,
    # so a bracket never needs an index that accepts the empty word.
    - "SELECT email FROM users WHERE (\t\temail = 'a'\t\t);"
    - "SELECT email FROM users WHERE (\n\n\nemail = 'a'\n\n\n);"
    - "SELECT email FROM users WHERE (                email = 'a'                );"
    - SELECT email FROM users WHERE ( NOT email = 'a' );
    - "SELECT email FROM users WHERE (\tNOT\t(\tNOT\temail = 'a'\t)\t);"
    - "SELECT email FROM users WHERE ((\t(\temail = 'a'\t)\t));"
    - SELECT email FROM users WHERE ( email = 'a' AND ( users.id = 1 OR ( verified = TRUE ) ) );
    - "SELECT email FROM users WHERE (email = 'a')\n\t;"

- group: aliases the exclusion group lets through
  expect: completed
  queries:
    # A strict prefix of a reserved name is not that name - no exclusion
    # accepts yet, so the group may end.
    - SELECT user.email FROM users AS user;
    - SELECT emai.email FROM users AS emai;
    - SELECT usersX.email FROM users AS usersX;
    - SELECT users_.email FROM users AS users_;
    - SELECT post.title FROM posts AS post;
    # Past the name, the exclusion died on the extra character.
    - SELECT email2.email FROM users AS email2;
    - SELECT SELECTED.email FROM users AS SELECTED;
    - SELECT NOTHING.email FROM users AS NOTHING;
    - SELECT ONE.email FROM users AS ONE;
    # A bare underscore is an identifier, and nothing reserves it.
    - SELECT _.email FROM users AS _;
    - SELECT __.email FROM users AS __;
    - SELECT _1.email FROM users AS _1;
    # The reserved list carries each keyword upper and lower cased, and
    # neither of these is either. Then one as long as an alias gets.
    - SELECT Select.email FROM users AS Select;
    - SELECT WhErE.email FROM users AS WhErE;
    - SELECT abcdefghijklmnopqrstuvwxyz0123456789.email FROM users AS abcdefghijklmnopqrstuvwxyz0123456789;

- group: aliases the exclusion group blocks
  expect: stuck
  queries:
    # A table name, a column name, and a keyword in both of its cases.
    - SELECT posts.title FROM posts AS posts;
    - SELECT comments.body FROM comments AS comments;
    - SELECT INNER.email FROM users AS INNER;
    - SELECT email.email FROM users AS email;
    - SELECT verified.email FROM users AS verified;
    - SELECT id.email FROM users AS id;
    - SELECT WHERE.email FROM users AS WHERE;
    - SELECT select.email FROM users AS select;
    - SELECT where.email FROM users AS where;
    - SELECT AS.email FROM users AS AS;
    - SELECT ON.email FROM users AS ON;
    - SELECT NULL.email FROM users AS NULL;
    # An identifier cannot open with a digit.
    - SELECT 1u.email FROM users AS 1u;

- group: numeric literals at their edges
  expect: completed
  queries:
    # `-?[0-9]+(\.[0-9]+)?` says nothing about the value, so a leading
    # zero, a signed zero and thirty digits are all just the shape.
    - SELECT email FROM users WHERE users.id = 0;
    - SELECT email FROM users WHERE users.id = -0;
    - SELECT email FROM users WHERE users.id = 000;
    - SELECT email FROM users WHERE users.id = 0.0;
    - SELECT email FROM users WHERE users.id = -0.0;
    - SELECT email FROM users WHERE users.id = 00.00;
    - SELECT email FROM users WHERE users.id > 123456789012345678901234567890;
    - SELECT email FROM users WHERE users.id < -123456789012345678901234567890;
    - SELECT email FROM users WHERE users.id >= 1.000000000000000000000001;
    - SELECT email FROM users WHERE users.id != -9.9;

- group: numbers the pattern refuses
  expect: stuck
  queries:
    # The dot needs digits on both sides, the sign has to touch, and
    # there is no exponent, no radix prefix and no separator.
    - SELECT email FROM users WHERE users.id = 1.;
    - SELECT email FROM users WHERE users.id = .5;
    - SELECT email FROM users WHERE users.id = --1;
    - SELECT email FROM users WHERE users.id = +1;
    - SELECT email FROM users WHERE users.id = 1.2.3;
    - SELECT email FROM users WHERE users.id = 1e5;
    - SELECT email FROM users WHERE users.id = 0x1;
    - SELECT email FROM users WHERE users.id = 1_000;
    - SELECT email FROM users WHERE users.id = - 1;

- group: text literals that spell the language back
  expect: completed
  queries:
    - SELECT email FROM users WHERE email = ' ';
    - "SELECT email FROM users WHERE email = '\\';"
    - SELECT email FROM users WHERE email = '%';
    - SELECT email FROM users WHERE email = '_';
    - SELECT email FROM users WHERE email = '%%%';
    # The terminator inside a literal is not the terminator.
    - SELECT email FROM users WHERE email = 'a;b';
    - SELECT email FROM users WHERE email = ';';
    # Nor is a keyword, a bracket or a comma; `[^']*` reads them all as
    # characters.
    - SELECT email FROM users WHERE email = 'SELECT * FROM users;';
    - SELECT email FROM users WHERE email = 'WHERE (a AND b)';
    - SELECT email FROM users WHERE email LIKE '%, %';
    - SELECT email FROM users WHERE email = 'users.email';
    # A character class matches a newline and a tab like anything else,
    # so a literal spans lines.
    - "SELECT email FROM users WHERE email = 'a\nb';"
    - "SELECT email FROM users WHERE email = 'a\tb';"
    - SELECT email FROM users WHERE email LIKE 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

- group: text literals that do not close
  expect: stuck
  queries:
    # A literal runs from one quote to the next, and that is the whole
    # rule - there is no escape and no doubling.
    - SELECT email FROM users WHERE email = 'a;
    - SELECT email FROM users WHERE email = 'a''b';
    - "SELECT email FROM users WHERE email = \"a\";"
    - SELECT email FROM users WHERE email = a;
    - SELECT email FROM users WHERE email = '';;
    - SELECT email FROM users WHERE email = ''';

- group: temporal literals at their shape
  expect: completed
  queries:
    # Four digits, two, two, and optionally a time of three more pairs.
    # Whether the date exists is not the pattern's business.
    - SELECT email FROM users WHERE created_at = '0000-00-00';
    - SELECT email FROM users WHERE created_at = '9999-99-99';
    - "SELECT email FROM users WHERE created_at > '2024-01-31 00:00:00';"
    - "SELECT email FROM users WHERE created_at < '9999-99-99 99:99:99';"
    - "SELECT email FROM users WHERE created_at != '2024-12-31 23:59:59';"
    - "SELECT email FROM users WHERE created_at <= '0001-01-01 01:01:01';"

- group: temporal literals off their shape
  expect: stuck
  queries:
    # One digit short, one separator wrong, one space too many, or a
    # precision the pattern does not carry.
    - SELECT email FROM users WHERE created_at = '2024-1-31';
    - SELECT email FROM users WHERE created_at = '24-01-31';
    - "SELECT email FROM users WHERE created_at = '2024-01-31 12:30';"
    - "SELECT email FROM users WHERE created_at = '2024-01-31T12:30:00';"
    - "SELECT email FROM users WHERE created_at = '2024-01-31  12:30:00';"
    - "SELECT email FROM users WHERE created_at = '2024-01-31 12:30:00.5';"
    - SELECT email FROM users WHERE created_at = '2024/01/31';
    - SELECT email FROM users WHERE created_at = 20240131;
    - SELECT email FROM users WHERE created_at = '2024-01-31 ';
    - SELECT email FROM users WHERE created_at = ' 2024-01-31';

- group: booleans, and what is not one
  expect: completed
  queries:
    # Two spellings, and equality is the only thing a boolean takes.
    - SELECT email FROM users WHERE verified != TRUE;
    - SELECT email FROM users WHERE verified = TRUE AND verified = FALSE;
    - SELECT email FROM users WHERE verified = FALSE;
    - SELECT email FROM users WHERE NOT verified = FALSE;

- group: booleans the pattern refuses
  expect: stuck
  queries:
    # `TRUE|FALSE` is the whole pattern, and a boolean has no order and
    # no pattern matching.
    - SELECT email FROM users WHERE verified = True;
    - SELECT email FROM users WHERE verified = tRuE;
    - SELECT email FROM users WHERE verified = T;
    - SELECT email FROM users WHERE verified = 1;
    - SELECT email FROM users WHERE verified = 'TRUE';
    - SELECT email FROM users WHERE verified = TRUEX;
    - SELECT email FROM users WHERE verified < TRUE;
    - SELECT email FROM users WHERE verified LIKE 'T%';

- group: filters piled up
  expect: completed
  queries:
    # The connective loop is flat, so a clause is as long as it likes and
    # the contradictions are nobody's problem here.
    - SELECT email FROM users WHERE verified = TRUE AND verified = FALSE AND verified = TRUE AND verified = FALSE AND verified = TRUE;
    - SELECT email FROM users WHERE users.id = 1 OR users.id = 2 OR users.id = 3 OR users.id = 4 OR users.id = 5 OR users.id = 6;
    - SELECT email FROM users WHERE users.id = 1 AND users.id = 2 OR users.id = 3 AND users.id = 4 OR users.id = 5;
    - SELECT email FROM users WHERE NOT verified = TRUE AND NOT verified = FALSE AND NOT created_at IS NULL;
    - SELECT email FROM users WHERE created_at IS NULL AND created_at IS NOT NULL;
    - SELECT email FROM users WHERE email LIKE 'a%' AND email NOT LIKE '%b' AND email = 'c' AND email != 'd';
    - SELECT email FROM users WHERE first_name = last_name AND last_name = first_name;

- group: operands that would say nothing
  expect: stuck
  queries:
    # Comparing a column with itself is refused however either side is
    # spelled, so the two spellings of one column never meet.
    - SELECT email FROM users WHERE users.id = users.id;
    - SELECT email FROM users WHERE users.id < users.id;
    - SELECT email FROM users WHERE created_at = created_at;
    - SELECT email FROM users WHERE created_at = users.created_at;
    - SELECT email FROM users WHERE users.created_at = created_at;
    - SELECT u.email FROM users AS u WHERE u.email LIKE u.email;
    - SELECT u.email FROM users AS u WHERE u.verified != u.verified;

- group: brackets at the limit
  expect: completed
  queries:
    # Three deep is the cap, and three is reachable from every direction
    # - nested, sequential, negated and combined.
    - SELECT email FROM users WHERE (((email = 'a' AND email = 'b')));
    - SELECT email FROM users WHERE ((email = 'a')) AND ((email = 'b'));
    - SELECT email FROM users WHERE (email = 'a') OR (email = 'b') OR (email = 'c');
