      WITH RECURSIVE t(n) AS (
          SELECT 1 FROM users
          UNION ALL
          SELECT n + 1 FROM t WHERE n < 3
      )
      SELECT n FROM t;
    - |-
      WITH RECURSIVE reach AS (
          SELECT u.id AS uid FROM users AS u WHERE u.id = 1
          UNION
          SELECT user_id FROM posts INNER JOIN reach ON posts.user_id = reach.uid
      )
      SELECT title FROM posts INNER JOIN reach ON posts.user_id = reach.uid;
