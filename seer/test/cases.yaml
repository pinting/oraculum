# -- aggregates, GROUP BY and HAVING ---------------------------------------

- group: aggregates in the projection
  expect: completed
  queries:
    # COUNT takes any column or `*`, and an aggregate alone needs no
    # GROUP BY: the whole relation is one group.
    - SELECT COUNT(*) FROM users;
    - SELECT COUNT(id) FROM users;
    - SELECT COUNT(email), COUNT(verified) FROM users;
    - SELECT COUNT( * ) FROM users;
    - "SELECT COUNT(\n\temail\n) FROM users;"
    # SUM and AVG take numbers, MIN and MAX anything with an order.
    - SELECT SUM(user_id) FROM posts;
    - SELECT AVG(user_id) FROM posts;
    - SELECT MIN(title), MAX(published_at) FROM posts;
    - SELECT MIN(created_at), MAX(email), MIN(id) FROM users;
    # Qualified arguments, and names given with AS.
    - SELECT COUNT(u.id) FROM users AS u;
    - SELECT COUNT(*) AS n FROM users;
    - SELECT COUNT(*) AS n, MAX(created_at) AS latest FROM users;
    - SELECT MAX(p.published_at) AS latest FROM posts AS p;
    # `COUNT(*)` demands no table, so any table may open the FROM clause,
    # and it may still be joined.
    - SELECT COUNT(*) FROM posts;
    - SELECT COUNT(*) FROM users INNER JOIN posts ON users.id = posts.user_id;
    # The argument narrows the tables like any column: `title` is posts.
    - SELECT COUNT(title) FROM posts;
    - SELECT COUNT(title), COUNT(c.body) FROM posts INNER JOIN comments AS c ON posts.id = c.post_id;

