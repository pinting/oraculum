    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT COUNT(n) FROM t) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT DISTINCT n + 1 FROM t) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT ROW_NUMBER() OVER () FROM t) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT n + 1 FROM t GROUP BY n) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT n + 1 FROM t ORDER BY n) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT n + 1 FROM t LIMIT 3) SELECT n FROM t;
