    # Nor every member after the first, and later definitions read it closed.
    - |-
      WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION SELECT 2 FROM posts UNION ALL SELECT n + 1 FROM t WHERE n < 4),
      s AS (SELECT n, COUNT(*) AS c FROM t GROUP BY n)
