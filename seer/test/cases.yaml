# -- WITH: virtual tables stacked under the main query ---------------------

- group: WITH definitions
  expect: completed
  queries:
    # A definition is a table to whatever follows it.
    - WITH c AS (SELECT email FROM users) SELECT email FROM c;
    - WITH c AS (SELECT email, first_name FROM users) SELECT first_name FROM c;
    - WITH c AS (SELECT u.email FROM users AS u) SELECT email FROM c;
    - WITH c AS (SELECT email FROM users WHERE verified = TRUE) SELECT email FROM c;
    - WITH c AS (SELECT email FROM users) SELECT x.email FROM c AS x;
    - WITH c AS (SELECT email FROM users) SELECT COUNT(*) FROM c;
    # Several, each over the ones before it.
    - WITH a AS (SELECT email FROM users), b AS (SELECT title FROM posts) SELECT email, title FROM a, b;
    - WITH a AS (SELECT id, email FROM users), b AS (SELECT email FROM a) SELECT email FROM b;
    - WITH a AS (SELECT id FROM users), b AS (SELECT id FROM a), c AS (SELECT id FROM b) SELECT id FROM c;
    # The brackets carry their whitespace; the comma carries its own.
    - WITH c AS ( SELECT email FROM users ) SELECT email FROM c;
    - "WITH c AS (\n  SELECT email FROM users\n)\nSELECT email FROM c;"
    - WITH a AS (SELECT email FROM users),b AS (SELECT title FROM posts) SELECT title FROM b;
    - WITH c AS (SELECT email FROM users WHERE (verified = TRUE)) SELECT email FROM c;
    # A definition does not have to be read.
    - WITH c AS (SELECT email FROM users) SELECT title FROM posts;
    # The names are only names: an alias inside a definition is its own.
    - WITH c AS (SELECT u.email FROM users AS u) SELECT u.email FROM c AS u;

