- group: WITH RECURSIVE keeps its recursive member simple
  expect: stuck
  queries:
    # Without RECURSIVE a definition cannot read itself.
    - WITH t(n) AS (SELECT 1 FROM users UNION ALL SELECT n + 1 FROM t WHERE n < 3) SELECT n FROM t;
    # Nor can the first member, nor one joined by INTERSECT or EXCEPT.
    - WITH RECURSIVE t(n) AS (SELECT n FROM t) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users INTERSECT SELECT n FROM t) SELECT n FROM t;
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users EXCEPT SELECT n FROM t) SELECT n FROM t;
    # The recursive member reads itself once, by inner joins only, and is last.
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT n + 1 FROM t, t AS t2) SELECT n FROM t;
    # Two aliases only the definition supplies would have to place it twice,
    # so the second is never offered the column.
    - WITH RECURSIVE t(n) AS (SELECT 1 FROM users UNION ALL SELECT a.n + b.n FROM t AS a, t AS b) SELECT n FROM t;
    - |-
      WITH RECURSIVE reach AS (
          SELECT u.id AS uid FROM users AS u
          UNION
          SELECT user_id FROM posts LEFT JOIN reach ON posts.user_id = reach.uid
