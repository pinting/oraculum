[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
# Off for WebAssembly: Pyodide has no pthreads, and rayon's pool cannot be
# built there at all. See src/runtime/pool.rs.
parallel = ["dep:rayon"]
pyo3 = ["dep:pyo3", "dep:numpy"]

[dependencies]
rand = "0.10.0"
rayon = { version = "1.10", optional = true }
rustc-hash = "2.1.1"
base64 = "0.22.1"
aho-corasick = "1.1.4"
derivre = "0.3"
toktrie = { git = "https://github.com/guidance-ai/llguidance.git", rev = "d83cbba9fe9f22f564d0b3db83a0880eab35265f" }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

[package.metadata.maturin]
bindings = "pyo3"
features = ["pyo3"]

[lints.rust]
dead_code = "allow"
unused_imports = "allow"