<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oraculum</title>
<style>
:root {
    --background: #14161a;
    --panel: #1b1e24;
    --line: #2b3039;
    --foreground: #d6dae1;
    --dim: #7d8794;
    --accent: #7fd1b9;
    --warn: #e6b566;
    --control: #232831;
    --field: #14171c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    background: var(--background);
    color: var(--foreground);
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

main {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
}

a {
    color: inherit;
    text-decoration: none;
}

a:hover {
    color: var(--accent);
}

.sub {
    margin: 0 0 20px;
    color: var(--dim);
    font-size: 13px;
}

.panel {
    margin-bottom: 14px;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
}

.panel[hidden] {
    display: none;
}

.label {
    margin-bottom: 8px;
    color: var(--dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.hint {
    margin: 0 0 10px;
    color: var(--dim);
    font-size: 12px;
}

.row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.more {
    align-self: center;
    color: var(--dim);
    font-size: 12px;
}

.warn {
    color: var(--warn);
}

.done {
    color: var(--accent);
}

#sql {
    min-height: 3em;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
}

#sql .caret {
    background: var(--accent);
    color: var(--background);
    animation: blink 1.1s steps(1) infinite;
}

@keyframes blink {
    50% {
        background: transparent;
        color: var(--accent);
    }
}

.tokens {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 1.6em;
}

button.token {
    padding: 3px 8px;
    background: var(--control);
    color: var(--foreground);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
}

button.token:hover {
    border-color: var(--accent);
    color: var(--accent);
}

button.token.separator {
    color: var(--dim);
}

#filter {
    margin-bottom: 12px;
}

button.action {
    padding: 5px 12px;
    background: var(--control);
    color: var(--foreground);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
}

button.action:hover:enabled {
    border-color: var(--accent);
}

button.action:disabled {
    color: var(--dim);
    cursor: default;
}

textarea,
input[type="text"] {
    width: 100%;
    padding: 8px;
    background: var(--field);
    color: var(--foreground);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    font-size: 12px;
}

textarea {
    min-height: 360px;
    margin-bottom: 10px;
}

input[type="text"] {
    font-size: 13px;
}

input[type="text"]:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

#log {
    max-height: 108px;
    overflow-y: auto;
    color: var(--dim);
    font-size: 12px;
    white-space: pre-wrap;
}
</style>
</head>
<body>
<main>
    <h1><a href="https://github.com/pinting/oraculum">oraculum</a></h1>
    
    <section class="panel" id="schema-panel">
        <div class="label">Schema</div>

        <textarea id="schema" spellcheck="false"><!-- SCHEMA --></textarea>

        <div class="row">
            <button class="action" id="build">BUILD</button>
            <span class="more" id="schema-status">the python runtime is fetched when you build</span>
        </div>
    </section>

    <section class="panel" id="statement-panel" hidden>
        <div class="label">Statement</div>

        <div id="sql"><span class="caret">&nbsp;</span></div>
    </section>

    <section class="panel" id="routes-panel" hidden>
        <div class="label">Accepted next tokens</div>

        <input
            type="text"
            id="filter"
            placeholder="type to filter - every token below is one the graph accepts"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false">

        <div class="tokens" id="routes"></div>

        <div class="row" style="margin-top: 14px;">
            <span class="more" id="status"></span>
        </div>
    </section>

    <section class="panel">
        <div class="label">Log</div>

        <div id="log"></div>
    </section>
</main>

<script>
const VIEW_LIMIT = 64;

let pyodide = null;
let manifest = null;

let booted = false;

let running = false;

function element(id) {
    return document.getElementById(id);
}

function log(message, className) {
    const line = document.createElement("div");

    if (className) {
        line.className = className;
    }

    line.textContent = message;

    const panel = element("log");

    panel.appendChild(line);
    panel.scrollTop = panel.scrollHeight;
}

function show(token) {
    if (token === " ") {
        return "␣";
    }

    if (token === "\t") {
        return "⇥";
    }

    if (token === "\n") {
        return "⏎";
    }

    return token;
}

function call(name, ...args) {
    const result = pyodide.globals.get(name)(...args);

    if (result === undefined || result === null) {
        return result;
    }

    if (typeof result.toJs !== "function") {
        return result;
    }

    const converted = result.toJs({ dict_converter: Object.fromEntries });

    result.destroy();

    return converted;
}

function tokenButton(id, token) {
    const button = document.createElement("button");

    button.className = "token";

    if (token.trim() === "") {
        button.className += " separator";
    }

    button.textContent = show(token);
    button.title = JSON.stringify(token);

    button.onclick = () => {
        feed(id);
    };

    return button;
}

function loadScript(source) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = source;
        script.onload = resolve;
        script.onerror = () => reject(new Error("failed to load " + source));

        document.head.appendChild(script);
    });
}

function yieldToPaint() {
    return new Promise((resolve) => window.setTimeout(resolve, 0));
}

async function boot() {
    try {
        manifest = await (await fetch("dist/manifest.json")).json();
    } catch (error) {
        throw new Error("dist/manifest.json missing - run 'make docs' first");
    }

    if (!window.loadPyodide) {
        await loadScript(manifest.pyodide_cdn + "/pyodide.js");
    }

    log(
        "pyodide " + manifest.pyodide
        + ", emscripten " + manifest.emscripten
        + ", pyodide-build " + manifest.pyodide_build
    );

    if (pyodide === null) {
        pyodide = await loadPyodide({
            stdout: (line) => log(line),
            stderr: (line) => log(line, "warn"),
        });
    }

    log("python " + pyodide.runPython("import sys; sys.version.split()[0]"));

    log("installing the vendored wheels...");

    await pyodide.loadPackage(["micropip", "numpy"]);

    const micropip = pyodide.pyimport("micropip");

    await micropip.install([
        "dist/" + manifest.sqlglot_wheel,
        "dist/" + manifest.kernel_wheel,
    ]);

    log("installed " + manifest.sqlglot_wheel + " and " + manifest.kernel_wheel);

    log("unpacking the seer sources...");

    const sources = await (await fetch("dist/seer.zip")).arrayBuffer();

    await pyodide.unpackArchive(sources, "zip", { extractDir: "/pkg" });

    log("fetching the vocabulary (4.8MB)...");

    const vocabulary = await (await fetch("dist/vocabulary.tiktoken")).arrayBuffer();

    pyodide.FS.writeFile("/vocabulary.tiktoken", new Uint8Array(vocabulary));

    log("vocabulary written to the emscripten filesystem");

    pyodide.runPython(`
<!-- RUNTIME -->
`);

    log("runtime ready");

    booted = true;
}

function buildFailed(message) {
    element("schema-panel").hidden = false;
    element("schema-status").className = "more warn";
    element("schema-status").textContent = message;
    element("build").disabled = false;
}

async function buildEngine() {
    const schema = element("schema").value;

    if (!schema.trim()) {
        element("schema-status").textContent = "the schema is empty";
        element("schema-status").className = "more warn";

        return;
    }

    element("build").disabled = true;
    element("schema-status").className = "more";
    element("schema-panel").hidden = true;

    if (!booted) {
        try {
            await boot();
        } catch (error) {
            log(String(error), "warn");

            console.error(error);
            buildFailed("the runtime did not load - see the log");

            return;
        }
    }

    await yieldToPaint();

    const started = performance.now();

    try {
        call("build", schema);
    } catch (error) {
        log(String(error), "warn");

        buildFailed("the schema did not build - see the log");

        return;
    }

    const elapsed = Math.round(performance.now() - started);

    log("engine built in " + elapsed + "ms");

    running = true;

    element("statement-panel").hidden = false;
    element("routes-panel").hidden = false;

    draw();
}

function feed(id) {
    call("feed", id);

    element("filter").value = "";

    draw();
}

function draw() {
    if (!running) {
        return;
    }

    const filter = element("filter").value;
    const current = call("view", filter, VIEW_LIMIT);

    drawStatement(current);
    drawRoutes(current, filter);
    drawStatus(current, filter);
}

function drawStatement(current) {
    const panel = element("sql");

    panel.textContent = current.matched;

    const caret = document.createElement("span");

    caret.className = "caret";
    caret.innerHTML = "&nbsp;";

    panel.appendChild(caret);
}

function drawRoutes(current, filter) {
    const panel = element("routes");

    panel.textContent = "";

    if (current.routes.length === 0) {
        const empty = document.createElement("span");

        if (current.completed) {
            empty.className = "more done";
            empty.textContent = "nothing follows — the statement is finished";
        } else if (filter !== "") {
            empty.className = "more warn";
            empty.textContent = "no accepted token starts with " + JSON.stringify(filter);
        } else {
            empty.className = "more warn";
            empty.textContent = "no routes — the graph is stuck";
        }

        panel.appendChild(empty);

        return;
    }

    for (const [id, token] of current.routes) {
        panel.appendChild(tokenButton(id, token));
    }

    if (current.more) {
        const rest = document.createElement("span");

        rest.className = "more";
        rest.textContent = "… +" + current.hidden + " not shown, keep typing to reach them";

        panel.appendChild(rest);
    }
}

function drawStatus(current, filter) {
    const status = element("status");

    if (current.completed) {
        status.className = "more done";
        status.textContent = "statement complete";

        return;
    }

    status.className = "more";

    if (filter === "") {
        status.textContent = current.total + " tokens accepted here";
    } else {
        status.textContent =
            current.matching + " of the " + current.total
            + " tokens accepted here start with " + JSON.stringify(filter);
    }
}

function submitFilter(event) {
    if (event.key !== "Enter") {
        return;
    }

    event.preventDefault();

    const filter = element("filter").value;

    if (filter === "") {
        return;
    }

    const current = call("view", filter, VIEW_LIMIT);

    if (current.exact >= 0) {
        feed(current.exact);

        return;
    }

    if (current.matching === 1) {
        feed(current.routes[0][0]);

        return;
    }

    if (current.matching === 0) {
        log("no accepted token starts with " + JSON.stringify(filter), "warn");
    }
}


element("build").onclick = buildEngine;
element("filter").oninput = draw;
element("filter").onkeydown = submitFilter;
</script>
</body>
</html>
